<!DOCTYPE html>
<html>
<head>
  <title>{{name}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="{{static_path('main.css')}}">
</head>
<body class="media">
  {% if type == "image" %}
    <a href="{{url_raw}}">
      <img src="{{url}}">
    </a>
  {% elif type == "video" %}
    <video controls autoplay loop>
      <source src="{{url}}">
    </video>
  {% elif type == "audio" %}
    <audio controls src="{{url}}">
    </audio>
  {% else %}
    <div class="alert alert-danger">Unknown media type: {{type}}.</div>
  {% endif %}
</body>
</html>
